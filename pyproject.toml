[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madrid-avisos"
version = "0.0.0"
description = "Da un empujón diario a los avisos de limpieza de tus calles en avisos.madrid.es"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
madrid-avisos = "madrid_avisos.cli:main"

[tool.setuptools]
packages = [
    "madrid_avisos",
    "madrid_avisos.adapters",
    "madrid_avisos.adapters.notify",
    "madrid_avisos.adapters.portal",
    "madrid_avisos.adapters.state",
    "madrid_avisos.application",
    "madrid_avisos.cli",
    "madrid_avisos.domain",
    "madrid_avisos.ports",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["madrid_avisos", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
